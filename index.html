<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bantara Banten Tatauan Upakara - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #c084fc 0%, #a78bfa 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1024px;
            aspect-ratio: 16 / 9;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        #gameContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        .menu-screen {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg"><rect fill="url(%23grad)" width="100%25" height="100%25"/><defs><linearGradient id="grad"><stop offset="0%25" style="stop-color:rgb(212,165,252);stop-opacity:1" /><stop offset="100%25" style="stop-color:rgb(253,191,105);stop-opacity:1" /></linearGradient></defs></svg>');
            background-size: cover;
        }

        .content-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 200px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-orange {
            background: linear-gradient(135deg, #fbbf24 0%, #f97316 100%);
            color: white;
        }

        .btn-green {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: white;
        }

        .btn-blue {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            color: white;
        }

        .btn-red {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 25px;
            font-size: 16px;
            min-width: auto;
        }

        .stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 15px;
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }

        .coin-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 30% 30%, #fbbf24, #f97316);
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .back-nav {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .game-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 768px) {
            button {
                padding: 12px 30px;
                font-size: 16px;
                min-width: 150px;
            }

            .content-box {
                padding: 30px 20px;
                max-width: 90%;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="gameContainer">
            <!-- Menu Screen -->
            <div id="menuScreen" class="screen active">
                <div class="image-container">
                    <img id="menuImage" class="game-image" src="" alt="Menu">
                    <div class="overlay">
                        <div class="button-group" style="margin-top: 200px;">
                            <button class="btn-orange" onclick="goToGame()">MULAI</button>
                            <button class="btn-green" onclick="goToInstructions()">PETUNJUK</button>
                            <button class="btn-red" onclick="goToProfile()">PROFIL PENGEMBANG</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Game Screen -->
            <div id="gameScreen" class="screen">
                <div class="image-container">
                    <img id="gameImage" class="game-image" src="" alt="Game">
                    <div class="stats">
                        <span class="coin-icon"></span>Coins: <span id="coinCount">150</span>
                    </div>
                    <div class="overlay">
                        <div class="button-group">
                            <button class="btn-green" onclick="startAdventure()">Mulai Petualangan</button>
                            <button class="btn-blue" onclick="goToMenu()">Kembali ke Menu</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Instructions Screen -->
            <div id="instructionsScreen" class="screen">
                <div class="image-container">
                    <img id="instructionsImage" class="game-image" src="" alt="Instructions">
                    <div class="overlay">
                        <div class="back-nav">
                            <button class="btn-blue btn-back" onclick="goToMenu()">← KEMBALI</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Profile Screen -->
            <div id="profileScreen" class="screen">
                <div class="image-container">
                    <img id="profileImage" class="game-image" src="" alt="Profile">
                    <div class="overlay">
                        <div class="back-nav">
                            <button class="btn-blue btn-back" onclick="goToMenu()">← KEMBALI</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Urgency Screen -->
            <div id="urgencyScreen" class="screen">
                <div class="image-container">
                    <img id="urgencyImage" class="game-image" src="" alt="Urgency">
                    <div class="overlay">
                        <div class="button-group" style="margin-top: 150px;">
                            <button class="btn-green" onclick="startGame()">MULAI PETUALANGAN</button>
                            <button class="btn-blue" onclick="goToGame()">Kembali</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game images - These are the URLs from your uploaded images
        // You'll need to replace these with the actual URLs of your images
        const gameImages = {
            menu: 'https://github.com/gedelumbung/bantara-game/raw/main/assets/menu.jpg', // Image 1
            instructions: 'https://github.com/gedelumbung/bantara-game/raw/main/assets/instructions.jpg', // Image 3
            profile: 'https://github.com/gedelumbung/bantara-game/raw/main/assets/profile.jpg', // Image 3
            game: 'https://github.com/gedelumbung/bantara-game/raw/main/assets/game.jpg', // Image 2
            urgency: 'https://github.com/gedelumbung/bantara-game/raw/main/assets/urgency.jpg' // Image 4
        };

        let playerCoins = 150;
        let playerLevel = 1;

        // Screen Navigation Functions
        function hideAllScreens() {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
        }

        function showScreen(screenId, imageSrc) {
            hideAllScreens();
            const screen = document.getElementById(screenId);
            screen.classList.add('active');
            
            // Load the appropriate image
            if (screenId === 'menuScreen') {
                document.getElementById('menuImage').src = gameImages.menu;
            } else if (screenId === 'gameScreen') {
                document.getElementById('gameImage').src = gameImages.game;
            } else if (screenId === 'instructionsScreen') {
                document.getElementById('instructionsImage').src = gameImages.instructions;
            } else if (screenId === 'profileScreen') {
                document.getElementById('profileImage').src = gameImages.profile;
            } else if (screenId === 'urgencyScreen') {
                document.getElementById('urgencyImage').src = gameImages.urgency;
            }
        }

        function goToMenu() {
            showScreen('menuScreen');
        }

        function goToGame() {
            showScreen('gameScreen', gameImages.game);
        }

        function goToInstructions() {
            showScreen('instructionsScreen', gameImages.instructions);
        }

        function goToProfile() {
            showScreen('profileScreen', gameImages.profile);
        }

        function startAdventure() {
            showScreen('urgencyScreen', gameImages.urgency);
        }

        function startGame() {
            playerCoins += 50;
            document.getElementById('coinCount').textContent = playerCoins;
            
            // Here you can add actual game mechanics
            alert(`Game Started! You now have ${playerCoins} coins!`);
            
            goToGame();
        }

        // Initialize - Show menu screen
        window.addEventListener('load', () => {
            goToMenu();
        });

        // Handle responsive resizing
        window.addEventListener('resize', () => {
            // Game will automatically scale with CSS
        });
    </script>
</body>
</html>
